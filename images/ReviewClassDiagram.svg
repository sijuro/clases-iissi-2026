<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500" font-family="sans-serif">
  <rect width="1180" height="500" fill="#FFFFFF"/>

  <!-- User -->
  <g>
    <rect x="30" y="40" width="240" height="150" rx="4" fill="#F1F1F1" stroke="#181818" stroke-width="1"/>
    <rect x="30" y="40" width="240" height="26" fill="#E4E4E4" stroke="#181818" stroke-width="1"/>
    <text x="150" y="58" text-anchor="middle" font-size="15" font-weight="bold">User</text>
    <line x1="30" y1="96" x2="270" y2="96" stroke="#181818" stroke-width="1"/>
    <text x="40" y="84" font-size="12">id: Integer</text>
    <text x="40" y="114" font-size="12">firstName: String</text>
    <text x="40" y="132" font-size="12">email: String</text>
    <text x="40" y="150" font-size="12">userType: String</text>
  </g>

  <!-- Restaurant -->
  <g>
    <rect x="30" y="300" width="240" height="150" rx="4" fill="#F1F1F1" stroke="#181818" stroke-width="1"/>
    <rect x="30" y="300" width="240" height="26" fill="#E4E4E4" stroke="#181818" stroke-width="1"/>
    <text x="150" y="318" text-anchor="middle" font-size="15" font-weight="bold">Restaurant</text>
    <line x1="30" y1="352" x2="270" y2="352" stroke="#181818" stroke-width="1"/>
    <text x="40" y="342" font-size="12">id: Integer</text>
    <text x="40" y="370" font-size="12">name: String</text>
    <text x="40" y="388" font-size="12">address: String</text>
    <text x="40" y="406" font-size="12">logo: String</text>
  </g>

  <!-- Order -->
  <g>
    <rect x="460" y="40" width="250" height="170" rx="4" fill="#F1F1F1" stroke="#181818" stroke-width="1"/>
    <rect x="460" y="40" width="250" height="26" fill="#E4E4E4" stroke="#181818" stroke-width="1"/>
    <text x="585" y="58" text-anchor="middle" font-size="15" font-weight="bold">Order</text>
    <line x1="460" y1="100" x2="710" y2="100" stroke="#181818" stroke-width="1"/>
    <text x="470" y="84" font-size="12">id: Integer</text>
    <text x="470" y="118" font-size="12">createdAt: Date</text>
    <text x="470" y="136" font-size="12">startedAt: Date</text>
    <text x="470" y="154" font-size="12">sentAt: Date</text>
    <text x="470" y="172" font-size="12">deliveredAt: Date</text>
    <text x="470" y="190" font-size="12">price: Double</text>
    <text x="470" y="208" font-size="12">restaurantId: Integer</text>
  </g>

  <!-- Review -->
  <g>
    <rect x="880" y="120" width="270" height="220" rx="4" fill="#F1F1F1" stroke="#181818" stroke-width="1"/>
    <rect x="880" y="120" width="270" height="26" fill="#E4E4E4" stroke="#181818" stroke-width="1"/>
    <text x="1015" y="138" text-anchor="middle" font-size="15" font-weight="bold">Review</text>
    <line x1="880" y1="200" x2="1150" y2="200" stroke="#181818" stroke-width="1"/>
    <text x="890" y="164" font-size="12">id: Integer</text>
    <text x="890" y="182" font-size="12">rating: Integer (1..5)</text>
    <text x="890" y="220" font-size="12">comment: String (max 500)</text>
    <text x="890" y="238" font-size="12">orderId: Integer {unique}</text>
    <text x="890" y="256" font-size="12">restaurantId: Integer</text>
    <text x="890" y="274" font-size="12">userId: Integer</text>
    <text x="890" y="292" font-size="12">createdAt: Date</text>
    <text x="890" y="310" font-size="12">updatedAt: Date</text>
  </g>

  <!-- User writes Review -->
  <polyline points="150,40 150,15 1015,15 1015,120" fill="none" stroke="#181818" stroke-width="1.2"/>
  <text x="160" y="30" font-size="12" fill="#333">1</text>
  <text x="1005" y="110" font-size="12" fill="#333" text-anchor="end">0..*</text>
  <text x="480" y="11" font-size="12" fill="#333">writes</text>

  <!-- Order is reviewed in Review -->
  <line x1="710" y1="150" x2="880" y2="150" stroke="#181818" stroke-width="1.2"/>
  <text x="718" y="144" font-size="12" fill="#333">1</text>
  <text x="872" y="144" font-size="12" fill="#333" text-anchor="end">0..1</text>
  <text x="745" y="142" font-size="12" fill="#333">is reviewed in</text>

  <!-- Restaurant receives Review -->
  <polyline points="270,375 1015,375 1015,340" fill="none" stroke="#181818" stroke-width="1.2"/>
  <text x="278" y="369" font-size="12" fill="#333">1</text>
  <text x="1005" y="360" font-size="12" fill="#333" text-anchor="end">0..*</text>
  <text x="600" y="369" font-size="12" fill="#333">receives</text>
</svg>
